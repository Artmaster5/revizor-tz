# ПРИМЕР. Этот файл не используется в репозитории: чтобы включить проверку,
# скопируйте его в .github/workflows/check-requirements.yml
# в репозитории, где лежат требования, и поправьте пути.
#
# Что делает: при изменении документов с требованиями запускает Ревизор ТЗ
# без модели (только правила, бесплатно, без ключей), кладёт отчёт в артефакты
# и роняет проверку, если найден хотя бы один блокер (CRITICAL).
#
# Предположение: код Ревизора лежит в папке tools/revizor вашего репозитория
# (или подключён иначе); поправьте REVIZOR_DIR под своё расположение.

name: check-requirements

on:
  pull_request:
    paths:
      - "requirements/**"

env:
  REVIZOR_DIR: tools/revizor
  REVIZOR_NO_DOTENV: "1"   # не читать .env; ключи берутся только из секретов

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r "$REVIZOR_DIR/requirements.txt"

      - name: Найти изменённые документы
        id: changed
        run: |
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'requirements/*.md' 'requirements/*.docx' 'requirements/*.pdf' > changed.txt
          cat changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Проверить документы без модели
        if: steps.changed.outputs.count != '0'
        run: |
          mkdir -p review-reports
          status=0
          while IFS= read -r doc; do
            name="$(basename "$doc")"
            python "$REVIZOR_DIR/main.py" \
              --input "$doc" \
              --output "review-reports/${name}.report.md" \
              --provider offline \
              --fail-on critical || status=$?
          done < changed.txt
          # код 3 от Ревизора означает «найден блокер», код 4 — «документ не прочитан»
          # (скан без текста, битый или пустой файл): такой документ не должен пройти проверку
          exit $status

      - name: Сохранить отчёты
        if: always() && steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: requirements-review
          path: review-reports/

# Вариант с моделью (раскомментируйте шаг вместо «без модели»).
