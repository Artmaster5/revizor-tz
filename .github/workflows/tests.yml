# Tests of the agent itself on three systems and three Python versions. No keys, no secrets, no paid model calls:
# REVIZOR_NO_DOTENV=1 and --provider offline. (docs/ci-example.yml is something else: an example for your own pipeline.)
name: tests

on:
  workflow_dispatch:   # запуск вручную: Actions → tests → Run workflow

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    env:
      REVIZOR_NO_DOTENV: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests (offline)
        run: python -W ignore -m unittest discover -s tests -t .

      - name: Smoke run of the CLI (offline)
        run: python main.py --input docs/requirements.md --output smoke/report.md --provider offline

      - name: Smoke run in a Windows console with code page 866, UTF-8 mode off
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 866
          set PYTHONUTF8=
          set PYTHONIOENCODING=
          python main.py --input docs\requirements.md --output "smoke 866\report.md" --provider offline
          if errorlevel 1 exit /b 1
          python main.py --version
          if errorlevel 1 exit /b 1
          if not exist "smoke 866\report.md" exit /b 1
